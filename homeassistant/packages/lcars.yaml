# HA-LCARS support entities (https://github.com/th3jesta/ha-lcars).
# Copy to <config>/packages/lcars.yaml and make sure configuration.yaml has:
#
#   homeassistant:
#     packages: !include_dir_named packages
#   frontend:
#     themes: !include_dir_merge_named themes

input_boolean:
  lcars_sound:
    name: LCARS Sound
    icon: mdi:volume-high
  lcars_texture:
    name: LCARS Texture
    icon: mdi:texture-box

input_number:
  lcars_vertical:
    name: LCARS Vertical
    min: 26
    max: 60
    step: 1
    initial: 26
    mode: slider
  lcars_horizontal:
    name: LCARS Horizontal
    min: 6
    max: 60
    step: 1
    initial: 6
    mode: slider
  lcars_menu_font:
    name: LCARS Menu Font
    min: 12
    max: 36
    step: 1
    initial: 20
    mode: slider

template:
  - sensor:
      - name: LCARS Header
        unique_id: lcars_header
        state: "{{ 'LCARS ' ~ states('sensor.time') }}"

# Named key so it merges with an existing `automation: !include automations.yaml`.
automation lcars:
  - id: lcars_set_default_theme
    alias: LCARS - Set default theme
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: frontend.set_theme
        data:
          name: LCARS Default
          mode: dark
